name: Test SyncRelay and optionally package DEB

on:
  workflow_dispatch:
    inputs:
      build_deb:
        description: 'Build a DEB only when device testing is needed'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  build:
    # Use the standard Intel image while hosted macOS arm64 capacity is constrained.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      THEOS_REV: cfba89a53a05b4a1b822121158acc3669c20602f
      SDK_REV: 0222fd5413cf4b9af096f37b4621afa2688572f7
    steps:
      - uses: actions/checkout@v4
      - name: Test production core on macOS
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p '*_test.py'
          clang -std=c11 -Wall -Wextra -Werror -I. Core/SRPacing.c tests/pacing_test.c -o "$RUNNER_TEMP/pacing-test"
          "$RUNNER_TEMP/pacing-test"
          clang -std=c11 -Wall -Wextra -Werror -I. Core/SROperationsState.c tests/operations_state_test.c -o "$RUNNER_TEMP/operations-state-test"
          "$RUNNER_TEMP/operations-state-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRPacing.c tests/store_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/store-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRSourceCapture.m Core/SRRunner.m Core/SRPacing.c tests/relay_pipeline_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/pipeline-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRRelayCoordinator.m Core/SRRuntimeLog.m Core/SROperationsState.c Core/SRPacing.c tests/relay_coordinator_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/relay-coordinator-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRRunner.m Core/SRPacing.c tests/automatic_progress_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/automatic-progress-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRRunner.m Core/SRRuntimeLog.m Core/SRExecutionProgress.m Core/SRPacing.c Adapter/SRSmallGroupSession.m tests/small_group_session_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/small-group-session-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatReader.m Core/SRSelection.m Core/SRConfiguration.m Core/SRPacing.c tests/adapter_test.m -framework Foundation -o "$RUNNER_TEMP/adapter-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRGroupPlanner.m Core/SRSelection.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRStore.m Core/SRMediaAlertState.m Core/SRPacing.c tests/group_planner_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/group-planner-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatReceiver.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRSourceCapture.m Core/SRStore.m Core/SRMediaAlertState.m Core/SROperationsState.c Core/SRPacing.c tests/receive_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/receive-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatReceiver.m Adapter/SRSourceTimeProbe.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SROperationsState.c Core/SRPacing.c tests/source_time_probe_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -o "$RUNNER_TEMP/source-time-probe-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRPacing.c tests/plan_queries_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/plan-queries-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatSendProbe.m tests/send_probe_test.m -framework Foundation -o "$RUNNER_TEMP/send-probe-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatTextSendAdapter.m tests/single_text_send_adapter_test.m -framework Foundation -o "$RUNNER_TEMP/single-text-send-adapter-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatTextSendHost.m tests/text_send_host_test.m -framework Foundation -o "$RUNNER_TEMP/text-send-host-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatSettingsEntry.m Core/SREntryPreferences.m tests/settings_entry_test.m -framework Foundation -o "$RUNNER_TEMP/settings-entry-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRRuntimeLog.m tests/runtime_log_test.m -framework Foundation -o "$RUNNER_TEMP/runtime-log-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatImageSource.m tests/image_source_test.m -framework Foundation -o "$RUNNER_TEMP/image-source-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRWeChatImageSendProbe.m tests/image_send_probe_test.m -framework Foundation -o "$RUNNER_TEMP/image-send-probe-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Adapter/SRRuntime.m Adapter/SRWeChatImageSendHost.m Core/SRImageAssetStore.m Core/SRMediaQuota.c tests/image_send_host_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -o "$RUNNER_TEMP/image-send-host-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRStore.m Core/SRMediaAlertState.m Core/SRSourceMessage.m Core/SRSourceCapture.m Core/SRConfiguration.m Core/SRPacing.c tests/image_asset_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/image-asset-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRPacing.c tests/library_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/library-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRPacing.c tests/library_task_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/library-task-test"
          clang -std=c11 -Wall -Wextra -Werror -I. Core/SRMediaQuota.c tests/media_quota_test.c -o "$RUNNER_TEMP/media-quota-test"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I. Core/SRStore.m Core/SRMediaAlertState.m Core/SRConfiguration.m Core/SRSourceMessage.m Core/SRImageAssetStore.m Core/SRMediaQuota.c Core/SRPacing.c tests/media_budget_test.m -framework Foundation -framework ImageIO -framework CoreGraphics -lsqlite3 -o "$RUNNER_TEMP/media-budget-test"
          for pass in 1 2 3; do
            "$RUNNER_TEMP/store-test"
            "$RUNNER_TEMP/adapter-test"
            "$RUNNER_TEMP/pipeline-test"
            "$RUNNER_TEMP/relay-coordinator-test"
            "$RUNNER_TEMP/automatic-progress-test"
            "$RUNNER_TEMP/small-group-session-test"
            "$RUNNER_TEMP/group-planner-test"
            "$RUNNER_TEMP/receive-test"
            "$RUNNER_TEMP/source-time-probe-test"
            "$RUNNER_TEMP/plan-queries-test"
            "$RUNNER_TEMP/send-probe-test"
            "$RUNNER_TEMP/single-text-send-adapter-test"
            "$RUNNER_TEMP/text-send-host-test"
            "$RUNNER_TEMP/settings-entry-test"
            "$RUNNER_TEMP/runtime-log-test"
            "$RUNNER_TEMP/image-source-test"
            "$RUNNER_TEMP/image-send-probe-test"
            "$RUNNER_TEMP/image-send-host-test"
            "$RUNNER_TEMP/image-asset-test"
            "$RUNNER_TEMP/library-test"
            "$RUNNER_TEMP/library-task-test"
            "$RUNNER_TEMP/media-quota-test"
            "$RUNNER_TEMP/media-budget-test"
          done
      - name: Install build tools
        if: github.event_name == 'workflow_dispatch' && inputs.build_deb
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Set up pinned toolchain (same revisions as OwnHide)
        if: github.event_name == 'workflow_dispatch' && inputs.build_deb
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/syncrelay-theos"
          git init "$dest"
          git -C "$dest" remote add origin https://github.com/roothide/theos.git
          git -C "$dest" fetch --depth=1 origin "$THEOS_REV"
          git -C "$dest" checkout --detach FETCH_HEAD
          git -C "$dest" submodule update --init --recursive
          sdk="$RUNNER_TEMP/syncrelay-sdks"
          git init "$sdk"
          git -C "$sdk" remote add origin https://github.com/theos/sdks.git
          git -C "$sdk" fetch --depth=1 origin "$SDK_REV"
          git -C "$sdk" checkout --detach FETCH_HEAD
          test -d "$sdk/iPhoneOS15.6.sdk"
          cp -R "$sdk/iPhoneOS15.6.sdk" "$dest/sdks/"
          echo "THEOS=$dest" >> "$GITHUB_ENV"
      - name: Build ordinary DEB (not a RootHide conversion)
        if: github.event_name == 'workflow_dispatch' && inputs.build_deb
        run: |
          set -euo pipefail
          printf '#define SR_BUILD_COMMIT @"%s"\n#define SR_BUILD_RUN @"%s"\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > Core/SRBuildRevision.h
          make package FINALPACKAGE=1 DEBUG=0
      - name: Verify package contents
        if: github.event_name == 'workflow_dispatch' && inputs.build_deb
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/package-check"
          count=$(find packages -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          test "$count" = 1
          deb=$(find packages -maxdepth 1 -name '*.deb')
          dpkg-deb -I "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/package-check"
          dylib="$RUNNER_TEMP/package-check/Library/MobileSubstrate/DynamicLibraries/SyncRelay.dylib"
          test -f "$dylib"
          test -f "$RUNNER_TEMP/package-check/Library/MobileSubstrate/DynamicLibraries/SyncRelay.plist"
          lipo -info "$dylib"
          lipo "$dylib" -verify_arch arm64 arm64e
          otool -L "$dylib"
          cp "$deb" dist/
          shasum -a 256 dist/*.deb > dist/SHA256SUMS
          printf '%s\n' 'Stage A source-time lifecycle checkpoint. Explicit start/stop, at most 16 delivered text samples or 120 monotonic seconds, plus at most 16 supplemental selected-source text/image hook reservations per arm. Foreground page transitions receive a two-second monotonic-clock grace; a timeout or DidEnterBackground stops sampling and releases the receiver without restart. A read-only resumedAfterInactive flag records a grace recovery within the same active round; it does not prove host page navigation or background semantics. Identity/configuration invalidation clears evidence. Probe creates no content, plan, run or claim and calls no sending/media preparation API. Existing manual 1-20 group sending remains outside the probe and is NOT part of this test. Actual wrap ABI and early callbacks can be observed but are not device-certified; sourceTimeSemanticsVerified and imageReadinessObserved stay false. The report exports the current schemaVersion only after store initialization succeeds; it does not prove the pre-open version, migration atomicity or row retention. No automatic capture, operations UI, library dispatch or video support. Schema 14: opening an older device database performs migration and requires separate authorization. No downgrade to schema-11 packages; preserve all history/claims. Ordinary DEB, NOT RootHide converted. This artifact authorizes no installation or device migration. Export sanitized evidence manually; no automatic upload.' > dist/DEVELOPMENT-NOTICE.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_deb
        with:
          name: SyncRelay-development-deb
          path: dist/
          if-no-files-found: error
          retention-days: 7
